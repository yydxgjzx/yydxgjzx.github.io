<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>云网工程进度看板</title>
<script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>if(typeof Chart==='undefined'){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';document.head.appendChild(s);}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#1e293b;color:#e2e8f0;min-height:100vh;-webkit-font-smoothing:antialiased}
.num{font-family:'DIN Alternate','Helvetica Neue','Roboto','PingFang SC',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.top-tabs{display:flex;background:#0f172a;border-bottom:2px solid #334155;padding:0;position:sticky;top:0;z-index:100}
.top-tab{flex:1;padding:12px 16px;text-align:center;font-size:14px;font-weight:600;color:#94a3b8;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
.top-tab:hover{color:#e2e8f0;background:#1e293b}
.top-tab.active{color:#60a5fa;border-bottom-color:#60a5fa;background:#1e293b}
.tab-panel{display:none}
.tab-panel.active{display:block}
.header{background:linear-gradient(135deg,#1e40af 0%,#0e7490 100%);color:#f1f5f9;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(0,0,0,.3);border-bottom:1px solid #334155}
.header h1{font-size:18px;font-weight:700;letter-spacing:1.5px}
.header .subtitle{font-size:11px;opacity:.85;margin-top:2px;color:#cbd5e1}
.header .date-badge{background:rgba(255,255,255,.15);border-radius:20px;padding:5px 16px;font-size:12px;color:#f1f5f9;border:1px solid rgba(255,255,255,.2)}
.summary-bar{display:flex;align-items:center;justify-content:center;gap:0;padding:8px 20px;background:#334155;box-shadow:0 2px 12px rgba(0,0,0,.2);flex-wrap:wrap;border-bottom:1px solid #475569}
.kpi-item{display:flex;align-items:center;gap:8px;padding:4px 16px;border-right:1px solid #475569;flex-shrink:0}
.kpi-item:last-child{border-right:none}
.kpi-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}
.kpi-dot.blue{background:#60a5fa;color:#60a5fa}
.kpi-dot.green{background:#4ade80;color:#4ade80}
.kpi-dot.orange{background:#fb923c;color:#fb923c}
.kpi-dot.red{background:#f87171;color:#f87171}
.kpi-dot.purple{background:#a78bfa;color:#a78bfa}
.kpi-dot.cyan{background:#22d3ee;color:#22d3ee}
.kpi-dot.teal{background:#2dd4bf;color:#2dd4bf}
.kpi-text{display:flex;flex-direction:column;gap:0}
.kpi-label{font-size:11px;color:#e2e8f0;line-height:1.2}
.kpi-value{font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-.03em}
.kpi-item .kpi-value.blue{color:#93c5fd}
.kpi-item .kpi-value.green{color:#86efac}
.kpi-item .kpi-value.orange{color:#fdba74}
.kpi-item .kpi-value.red{color:#f87171;font-size:24px}
.kpi-item .kpi-value.purple{color:#c4b5fd}
.kpi-item .kpi-value.cyan{color:#67e8f9}
.kpi-sub{font-size:10px;color:#cbd5e1;font-weight:500}
.ring-in-kpi{gap:6px!important;padding:4px 12px!important}
.ring-in-kpi canvas{width:40px!important;height:40px!important}
.ring-row{display:flex;gap:0;padding:0 12px;align-items:center}
.ring-mini{display:flex;align-items:center;gap:8px;padding:4px 12px;border-right:1px solid #475569}
.ring-mini:last-child{border-right:none}
.ring-mini canvas{width:50px!important;height:50px!important}
.ring-mini-info{display:flex;flex-direction:column;gap:1px}
.ring-mini-title{font-size:10px;color:#cbd5e1}
.ring-mini-pct{font-size:18px;font-weight:700;line-height:1;letter-spacing:-.03em}
.ring-mini-pct.accept{color:#bae6fd}
.ring-mini-pct.close{color:#bbf7d0}
.ring-mini-target{font-size:10px;color:#cbd5e1}
.ring-mini-target em{color:#ef4444;font-style:normal;font-weight:600}
.content-section{padding:12px 20px 20px}
.tabs{display:flex;gap:6px;margin-bottom:12px;justify-content:center}
.tab-btn{padding:6px 18px;border-radius:8px;border:1px solid #475569;font-size:13px;cursor:pointer;background:#334155;color:#94a3b8;font-weight:500;transition:all .2s}
.tab-btn:hover{background:#475569;color:#e2e8f0}
.tab-btn.active{background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#f1f5f9;box-shadow:0 4px 16px rgba(37,99,235,.4);border-color:transparent}
.panel{display:none}
.panel.active{display:block}
.chart-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.chart-card{background:#334155;border-radius:10px;padding:14px;box-shadow:0 2px 12px rgba(0,0,0,.25);border:1px solid #475569}
.chart-card h3{font-size:12px;font-weight:600;margin-bottom:10px;color:#e2e8f0;display:flex;align-items:center;gap:6px}
.chart-card h3::before{content:'';display:inline-block;width:3px;height:12px;border-radius:2px;background:#60a5fa;flex-shrink:0}
.chart-card canvas{max-height:180px}
.table-card{background:#334155;border-radius:10px;padding:12px 14px;box-shadow:0 2px 12px rgba(0,0,0,.25);margin-bottom:10px;overflow-x:auto;border:1px solid #475569;display:flex;flex-direction:column}
.table-card table{flex:1}
.table-card h3{font-size:12px;font-weight:600;margin-bottom:10px;color:#e2e8f0;display:flex;align-items:center;gap:6px}
.table-card h3::before{content:'';display:inline-block;width:3px;height:12px;border-radius:2px;background:#60a5fa;flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
thead tr{background:linear-gradient(135deg,#1e40af,#1d4ed8)}
th{padding:7px 8px;text-align:center;font-weight:600;color:#f1f5f9;white-space:nowrap;font-size:11px;letter-spacing:.3px}
th.accept-col{background:rgba(96,165,250,.25)}
th.close-col{background:rgba(74,222,128,.2)}
th.amount-col{background:rgba(167,139,250,.2)}
th.rate-col{background:rgba(251,191,36,.15)}
tbody tr:nth-child(odd) td{background:#374151}
tbody tr:nth-child(even) td{background:#334155}
tbody tr:hover td{background:#3f4d63;transition:background .15s}
td.accept-col{background:rgba(96,165,250,.10)}
tbody tr:hover td.accept-col{background:rgba(96,165,250,.20)}
td.close-col{background:rgba(74,222,128,.10)}
tbody tr:hover td.close-col{background:rgba(74,222,128,.20)}
td.amount-col{background:rgba(167,139,250,.08)}
tbody tr:hover td.amount-col{background:rgba(167,139,250,.15)}
td{padding:6px 8px;text-align:center;border-bottom:1px solid #475569;color:#cbd5e1;font-size:12px}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700}
.rank-1{background:linear-gradient(135deg,#34d399,#059669);color:#fff;box-shadow:0 2px 8px rgba(52,211,153,.5)}
.rank-2{background:linear-gradient(135deg,#34d399,#10b981);color:#fff;box-shadow:0 2px 8px rgba(52,211,153,.4)}
.rank-3{background:linear-gradient(135deg,#6ee7b7,#059669);color:#fff;box-shadow:0 2px 8px rgba(52,211,153,.4)}
.rank-bottom{background:linear-gradient(135deg,#f87171,#dc2626);color:#fff;box-shadow:0 2px 8px rgba(248,113,113,.5)}
.rank-other{background:#475569;color:#94a3b8}
.progress-bar-cell{min-width:60px;text-align:center}
.progress-bar-wrap{background:#475569;border-radius:3px;height:6px;overflow:hidden;margin-bottom:2px}
.progress-bar-fill{height:6px;border-radius:3px;transition:width .6s ease}
.pct-text{font-size:10px;color:#94a3b8;font-weight:600;letter-spacing:-.02em}
.over-target{color:#f87171;font-weight:700}
.need-more{color:#fb923c;font-weight:600}
.on-track{color:#4ade80;font-weight:600}
.month-val{color:#fbbf24;font-weight:600}
.overdue-val{color:#f87171;font-weight:700}
.overdue-zero{color:#64748b}
.total-row td{background:linear-gradient(90deg,#1e3a5f,#334155)!important;font-weight:700;color:#7dd3fc}
.zg-top-row td{background:rgba(52,211,153,.10)!important;border-left:3px solid #34d399}
.zg-bottom-row td{background:rgba(248,113,113,.10)!important;border-left:3px solid #f87171}
.table-radar-row{display:grid;grid-template-columns:1fr 340px;gap:10px;margin-bottom:10px;align-items:stretch}
.table-radar-row>.table-card,.table-radar-row>.chart-card{height:100%}
.table-wide table{width:100%}
.table-wide td:first-child,.table-wide th:first-child{min-width:80px;max-width:none;text-align:center;white-space:normal;word-break:keep-all}
.radar-side canvas{flex:1;max-height:100%!important;min-height:260px}
.footer{text-align:center;color:#475569;font-size:11px;padding:12px}
canvas{filter:brightness(1)}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9999;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex;align-items:center;justify-content:center}
.modal-box{background:#1e293b;border:1px solid #475569;border-radius:12px;width:90%;max-width:1000px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #334155;flex-shrink:0}
.modal-header h3{font-size:15px;font-weight:700;color:#e2e8f0}
.modal-header .modal-count{font-size:12px;color:#64748b;margin-left:10px}
.modal-close{background:none;border:none;color:#94a3b8;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:4px;transition:.2s}
.modal-close:hover{background:#334155;color:#e2e8f0}
.modal-export{background:rgba(74,222,128,.15);border:1px solid #4ade80;color:#4ade80;font-size:12px;cursor:pointer;padding:4px 12px;border-radius:6px;transition:.2s;margin-right:8px}
.modal-export:hover{background:#4ade80;color:#0f172a}
.modal-body{overflow-y:auto;padding:0}
.modal-table{width:100%;border-collapse:collapse;font-size:12px}
.modal-table th{position:sticky;top:0;background:#334155;color:#94a3b8;padding:6px 10px;text-align:left;font-weight:600;border-bottom:1px solid #475569;white-space:nowrap;font-size:11px}
.modal-table td{padding:5px 10px;border-bottom:1px solid #2d3748;color:#cbd5e1;vertical-align:middle;font-size:12px}
.modal-table tr:hover td{background:rgba(96,165,250,.06)}
.modal-table .code-col{font-family:monospace;font-size:11px;color:#64748b}
.modal-table .name-col{max-width:360px;white-space:normal;word-break:break-all}
.status-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap}
.status-open{background:rgba(251,191,36,.15);color:#fbbf24}
.status-accept{background:rgba(96,165,250,.15);color:#93c5fd}
.status-close{background:rgba(74,222,128,.15);color:#4ade80}
.status-other{background:rgba(100,116,139,.15);color:#94a3b8}
.clickable{cursor:pointer;transition:.15s}
.clickable:hover{color:#60a5fa!important;text-decoration:underline}
.amount-positive{color:#f87171}
.amount-negative{color:#4ade80}
.rate-high{color:#4ade80;font-weight:700}
.rate-mid{color:#fbbf24;font-weight:600}
.rate-low{color:#f87171;font-weight:700}
/* 新建Tab字体放大 */
#panel-xj th{font-size:12px;padding:8px 10px}
#panel-xj td{font-size:13px;padding:7px 10px}
#panel-xj .kpi-label{font-size:12px}
#panel-xj .kpi-value{font-size:24px}
#panel-xj .kpi-sub{font-size:11px}
#panel-xj .pct-text{font-size:11px}
#panel-xj .chart-card h3{font-size:13px}
#panel-xj .tab-btn{font-size:14px;padding:8px 22px}
/* === Mobile Responsive === */
@media(max-width:768px){
  .header{padding:10px 16px}
  .header h1{font-size:15px;letter-spacing:.5px}
  .header .subtitle{font-size:10px}
  .header .date-badge{font-size:11px;padding:4px 12px}
  .top-tab{font-size:12px;padding:10px 8px;letter-spacing:0}
  .content-section{padding:8px 10px 16px}
  /* KPI: 2x grid, avoid truncation */
  .summary-bar{padding:8px 10px;justify-content:center;flex-wrap:wrap;gap:4px}
  .kpi-item{padding:6px 10px;border-right:none;border-bottom:1px solid #2d3748;flex:1 1 45%;min-width:45%;max-width:50%}
  .kpi-item:nth-child(odd){border-right:1px solid #475569}
  .kpi-value{font-size:20px}
  .kpi-label{font-size:10px}
  .kpi-sub{font-size:9px}
  .ring-in-kpi canvas{width:36px!important;height:36px!important}
  .tabs{gap:4px;margin-bottom:8px}
  .tab-btn{padding:5px 12px;font-size:12px;border-radius:6px}
  /* Charts: single column on mobile */
  .chart-row{grid-template-columns:1fr!important;gap:8px}
  .table-radar-row{grid-template-columns:1fr!important;gap:8px}
  .table-radar-row .radar-side{min-height:auto}
  /* Table: sticky first column, .table-card is the scroll container */
  .table-card{padding:10px 6px;overflow-x:auto;-webkit-overflow-scrolling:touch;display:block}
  .table-card table{display:table;min-width:500px;width:max-content}
  .chart-card{padding:10px}
  .chart-card canvas{max-height:160px}
  .radar-side canvas{min-height:200px!important}
  table{font-size:11px}
  th{padding:5px 4px;font-size:10px}
  td{padding:4px 4px;font-size:11px}
  td:first-child,th:first-child{position:sticky;left:0;z-index:2;min-width:60px;max-width:80px;white-space:normal;word-break:keep-all}
  .table-wide td:first-child,.table-wide th:first-child{min-width:60px;max-width:80px}
  thead tr{position:relative}
  th:first-child{background:linear-gradient(135deg,#1e40af,#1d4ed8);z-index:3}
  tbody tr:nth-child(odd) td:first-child{background:#374151}
  tbody tr:nth-child(even) td:first-child{background:#334155}
  tbody tr:hover td:first-child{background:#3f4d63}
  tr.total-row td:first-child{background:linear-gradient(90deg,#1e3a5f,#334155)!important;z-index:3}
  .progress-bar-wrap{height:5px}
  .progress-bar-fill{height:5px}
  .pct-text{font-size:9px}
  .rank-badge{width:18px;height:18px;font-size:9px}
  /* Modal: full screen on mobile, sticky first column */
  .modal-box{width:100%;max-height:100vh;border-radius:0}
  .modal-header{padding:12px 14px}
  .modal-header h3{font-size:14px}
  .modal-body{-webkit-overflow-scrolling:touch;overflow:auto}
  .modal-table{font-size:11px;min-width:600px;display:table;width:max-content}
  .modal-table thead th:first-child,.modal-table tbody td:first-child{position:sticky;left:0;z-index:2;min-width:50px;max-width:90px;white-space:normal;word-break:keep-all}
  .modal-table thead th:first-child{background:#1e3a8a;z-index:3}
  .modal-table tbody tr:nth-child(odd) td:first-child{background:#374151}
  .modal-table tbody tr:nth-child(even) td:first-child{background:#334155}
  .modal-table tbody tr:hover td:first-child{background:#3f4d63}
  .modal-table th{padding:4px 6px;font-size:10px}
  .modal-table td{padding:3px 6px;font-size:11px}
  .modal-table .name-col{max-width:140px}
  .status-badge{font-size:9px;padding:1px 6px}
  #panel-xj th{font-size:10px;padding:5px 4px}
  #panel-xj td{font-size:11px;padding:4px 4px}
  #panel-xj .kpi-label{font-size:10px}
  #panel-xj .kpi-value{font-size:20px}
  .ring-mini canvas{width:40px!important;height:40px!important}
  .ring-mini-pct{font-size:15px}
  .footer{font-size:10px;padding:8px}
  /* Hide radar on mobile, show group bar instead */
  .radar-mobile-hide{display:none!important}
  .radar-mobile-show{display:block!important}
}
@media(min-width:769px){
  .radar-mobile-show{display:none!important}
}
@media(max-width:400px){
  .header h1{font-size:13px}
  .kpi-item{padding:4px 8px;flex:1 1 48%}
  .kpi-value{font-size:18px}
  .top-tab{font-size:11px;padding:8px 4px}
  table{min-width:450px}
}
</style>
</head>

var STORAGE_KEY = "dashboard_auth_v2";
var PWD_CACHE = null; // 内存中缓存密码

// 从 localStorage 读取缓存的密码
function getCachedPwd() {
  try {
    var s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (s && s.pwd && s.ts && Date.now() - s.ts < 30 * 24 * 3600 * 1000) {
      return s.pwd;
    }
  } catch(e) {}
  return null;
}

function cachePwd(pwd) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({pwd: pwd, ts: Date.now()}));
}

function clearPwdCache() {
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

// Base64 → ArrayBuffer
function b64ToBuf(b64) {
  var bin = atob(b64);
  var len = bin.length;
  var bytes = new Uint8Array(len);
  for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

// 字符串 → SHA-256 → AES-GCM key
async function deriveKey(pwd) {
  var enc = new TextEncoder();
  var hashBuf = await crypto.subtle.digest('SHA-256', enc.encode(pwd));
  return crypto.subtle.importKey('raw', hashBuf, {name: 'AES-GCM'}, false, ['decrypt']);
}

// 解密并渲染
async function decryptAndRender(pwd) {
  try {
    var key = await deriveKey(pwd);
    var nonce = b64ToBuf(NONCE_B64);
    var ct = b64ToBuf(CT_B64);
    var plainBuf = await crypto.subtle.decrypt({name: 'AES-GCM', iv: nonce}, key, ct);
    var plainText = new TextDecoder().decode(plainBuf);
    return plainText;
  } catch(e) {
    return null;
  }
}

// 执行解锁
async function doUnlock() {
  var pwdInput = document.getElementById('auth-pwd');
  var pwd = pwdInput.value;
  var errEl = document.getElementById('auth-error');
  var formEl = document.getElementById('auth-form');
  var pendEl = document.getElementById('auth-pending');
  
  if (!pwd) return;
  
  formEl.style.display = 'none';
  pendEl.style.display = 'block';
  errEl.style.display = 'none';
  
  // 短暂延迟让动画显示
  await new Promise(r => setTimeout(r, 300));
  
  var plain = await decryptAndRender(pwd);
  
  if (plain) {
    // 解密成功
    cachePwd(pwd);
    PWD_CACHE = pwd;
    injectContent(plain);
  } else {
    // 解密失败
    pendEl.style.display = 'none';
    formEl.style.display = 'block';
    errEl.style.display = 'block';
    pwdInput.value = '';
    pwdInput.focus();
  }
}

// 公共：注入解密内容并渲染
function injectContent(plain) {
    var appDiv = document.getElementById('app-content');
    appDiv.innerHTML = plain;
    appDiv.style.display = 'block';
    
    // 执行注入内容中的所有script（按顺序）
    var scripts = appDiv.querySelectorAll('script');
    for (var i = 0; i < scripts.length; i++) {
      var s = document.createElement('script');
      s.textContent = scripts[i].textContent;
      appDiv.appendChild(s);
      scripts[i].remove();
    }
    
    // 隐藏登录覆盖层
    var overlay = document.getElementById('auth-overlay');
    overlay.style.opacity = '0';
    overlay.style.transition = 'opacity .4s';
    setTimeout(function() { overlay.style.display = 'none'; }, 400);
    
    // 手动触发渲染（因为DOMContentLoaded已经触发过，注入内容中的监听器不会执行）
    setTimeout(function() {
      try { if (typeof renderJiezhuan === 'function') renderJiezhuan(); } catch(e) {}
      try { if (typeof renderXinjian === 'function') renderXinjian(); } catch(e) {}
      try { if (typeof renderGuazhang === 'function') renderGuazhang(); } catch(e) {}
      try { if (typeof renderZhuangu === 'function') renderZhuangu(); } catch(e) {}
    }, 100);
}

// 页面加载：检查是否有缓存的密码，自动解锁
window.addEventListener('DOMContentLoaded', async function() {
  var cached = getCachedPwd();
  if (cached) {
    // 自动尝试解锁
    var plain = await decryptAndRender(cached);
    if (plain) {
      PWD_CACHE = cached;
      injectContent(plain);
      return;
    }
  }
  // 没有缓存或解密失败，显示登录页
  var pwdInput = document.getElementById('auth-pwd');
  if (pwdInput) pwdInput.focus();
});
</script>
